server {
    listen 8080;
    root /usr/share/nginx/html;

    # connect-src and img-src 'self' also enforce the rule that the browser only
    # ever talks to our own origin, never to the product data source.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:3000;
        # Overwrites anything the client sent, so rate limiting cannot be dodged
        # by spoofing the header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }

    # Vite puts a content hash in these file names.
    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
    }
}
